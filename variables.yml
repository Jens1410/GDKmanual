strom_definition: "Verbrauch von elektrischer Energie für alle elektrischen Geräte, Anlagen und Prozesse, die nicht der Wärmeenergieerzeugung dienen. Dazu zählen z. B. Beleuchtung, IT- und Bürogeräte, Maschinen und Produktionsanlagen, Kühl- und Lüftungssysteme."
strom_definition_exception: "Verbräuche von elektrischen Heizungen oder Wärmepumpen mit eigenem Zähler werden nicht dem Strom-Verbrauch zugeordnet, sondern dem Sektor **Wärmeenergie-Verbrauch**."
waerme_definition: "Verbrauch von Energie zur Erzeugung von Wärme, unabhängig von der Energiequelle oder Technologie. Dazu zählen: Heizungssysteme (z. B. Gasheizungen, Ölheizungen, Fernwärme); Elektrische Heizungen (z. B. Direktheizungen, Wärmepumpen mit eigenem Zähler); Warmwasserbereitung (z. B. Boiler, Durchlauferhitzer), Industrielle Wärmeprozesse (z. B. in Produktionsanlagen)."
wasser_definition: "Verbrauch von Trinkwasser und Warmwasser in Gebäuden oder Anlagen. Dazu zählen: Kaltes Trinkwasser (z. B. für Sanitäranlagen, Küchen, Reinigung); Warmwasser (z. B. für Duschen, Waschbecken, Spülmaschinen)."
