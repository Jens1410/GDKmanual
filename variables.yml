deliverypoint_name_definition: "Eindeutige für dich erkennbare Bezeichnung der Lieferstelle"
deliverypoint_marketlocation_definition: "Eindeutige, bundesweite Kennung für Marktlokationen im deutschen Strom- und Gasmarkt. Sie dient der Identifikation von physischen oder virtuellen Punkten, an denen Energie gemessen, bilanziell erfasst oder gehandelt wird. Du findest die MaLo-ID in der Regel auf deiner Strom- oder Gasrechnung."
