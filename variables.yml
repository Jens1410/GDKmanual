meter_datasource_definition: "Bezeichnung und ggf. Identifikationsnummer der Datenquelle, z. B. Zählernummer oder Fahrtenbuch-ID."
meter_activitystatus_definition: "Status des Zählers (aktiv/inaktiv). Ein aktiver Zähler liefert aktuelle Verbrauchsdaten, während ein inaktiver Zähler keine Daten mehr liefert."
meter_activitystatus_usage: "Nach einem Zählerwechsel setzt du den alten Zähler auf 'inaktiv' und legst einen neuen Zähler an. Der inaktive Zähler liefert keine Daten mehr, während der neue (aktive) Zähler die aktuelle Verbrauchserfassung übernimmt und fortsetzt."
meter_location_definition: "Eine eindeutige, bundesweite Kennung, die einen Zähler anhand von Land, Netzbetreiber, Region/Netzgebiet und Zählernummer identifiziert. Sie ist insbesondere für Strom- und Gaszähler standardisiert und wird in der Regel auf der Rechnung angegeben."
meter_deliverypoint_assignment_definition: "Auswahl über die für den gewählten Verbrauchssektor definierten Lieferstellen. Der Inhalt dieser Auswahl richtet sich nach dem zuvor gewälten Verbrauchssektor (Strom, Wärme, Wasser, Gas, Abfall, Papier, Lebensmittel, Bürobedarf, Haushaltsbedarf)."
meter_recordingmethod_definition: "Auswahl eines Kriteriums für die Verbrauchsmengenerfassung."
meter_recordingmethod_metervalues_definition: "Fortlaufende Eingabe von größer werdenenden Zählerständen, welche den Verbrauch über die Zeit darstellen."
meter_recordingmethod_metervalues_example: "Stromzähler: Der Verbrauch über eine Periode errechnet sich aus der Differenz zwischen den Zählerständen der aktuellen zur vorangegangenen Ablesung."
meter_recordingmethod_quantities_definition: "Fortlaufende Eingabe von Mengenangaben, welche den Verbrauch über die Zeit darstellen."
meter_recordingmethod_quantities_example: "Fahrtenbuch: Der Verbrauch über eine Periode errechnet sich aus der Summe der in dieser Zeit gefahrenen Kilometer."
meter_recordingmethod_delivery_definition: "Fortlaufende Eingabe kleiner werdender Bestandsmengen."
meter_recordingmethod_delivery_example: "Füllstand im Öltank: Der Verbrauch über eine Periode errechnet sich aus der Differenz des (geringeren) Bestandes der aktuellen Ablesung zur vorangegangenen Ablesung."
meter_recordingmethod_meterwithpartialvalues_definition: "Zählerwerte mit Teilwerten"
meter_recordingmethod_meterwithpartialvalues_example: "Hier wird noch gearbeitet."
meter_resource_definition: "Auswahl über die materielle Ressource, deren Verbrauch durch den Zähler erfasst wird. Der Inhalt dieser Auswahl richtet sich nach dem zuvor gewälten Verbrauchssektor (Strom, Wärme, Wasser, Gas, Abfall, Papier, Lebensmittel, Bürobedarf, Haushaltsbedarf)"
meter_emission_definition: "Hier wird noch gearbeitet."
meter_unit_definition: "Auswahl über die gemessene Einheit des Verbrauchs."
meter_position_definition: "Angabe zur Position des Zählers, um dessen Auffindung zu ermöglichen."

